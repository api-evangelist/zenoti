aid: zenoti
name: Zenoti
description: >-
  Zenoti is an AI-powered, all-in-one cloud management platform for the beauty,
  wellness, and fitness industries, serving 30,000+ salons, spas, medspas,
  barbershops, and fitness centers across 50+ countries. It covers online
  booking, point of sale and payments, memberships, packages, gift cards,
  loyalty, marketing, staff scheduling, and business intelligence. Zenoti
  exposes a large REST API (~283 documented operations) with API-key and
  bearer-token authentication, signed webhooks, page-number pagination, and
  per-organization rate limiting, letting partners build custom booking,
  membership-sale, product-sale, gift-card, and CRM/opportunity workflows on
  top of the platform.
